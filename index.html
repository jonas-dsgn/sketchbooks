/* =====================================================================
   LIQUID GLASS LAYER
   Recipe borrowed from the reference: translucent fill, heavy blur +
   saturation, hairline rim, top inner highlight, diagonal specular
   sheen, soft drop shadow, springy press feedback.
   ===================================================================== */
body{font:500 14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--ac) 45%,transparent)}
#app{scrollbar-width:thin;scrollbar-color:var(--line) transparent}

/* --- ambient light field the glass refracts --- */
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
 background:
  radial-gradient(42% 46% at 16% 18%,var(--o1),transparent 72%),
  radial-gradient(38% 42% at 86% 12%,var(--o2),transparent 72%),
  radial-gradient(44% 50% at 74% 90%,var(--o3),transparent 72%),
  radial-gradient(40% 44% at 8% 86%,var(--o4),transparent 72%);
 animation:drift 40s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(2.5%,-2%,0) scale(1.07) rotate(1.5deg)}}
body:has(.rd)::before{display:none}
body:has(.pvm)::before{animation-play-state:paused}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes fade{from{opacity:0}}

/* --- reader / preview / loader live on a dark stage: local tokens --- */

.pvm{--g:color-mix(in srgb,var(--pf) 8%,rgba(255,255,255,.15));--gb:color-mix(in srgb,var(--pf) 16%,rgba(255,255,255,.34));--gx:color-mix(in srgb,var(--pf) 10%,rgba(255,255,255,.2));--gHov:color-mix(in srgb,var(--pf) 8%,rgba(255,255,255,.28))}

 -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
 border:1px solid var(--gb);

function vnoise(S,c,r){const n=Math.max(2,Math.round(S/c)),g=new Float32Array(n*n),o=new Float32Array(S*S),cs=S/n;for(let i=0;i<g.length;i++)g[i]=r();for(let y=0;y<S;y++){const fy=y/cs,y0=fy|0,t=fy-y0,sy=t*t*(3-2*t),y1=(y0+1)%n;for(let x=0;x<S;x++){const fx=x/cs,x0=fx|0,u=fx-x0,sx=u*u*(3-2*u),x1=(x0+1)%n,a=g[y0*n+x0],b=g[y0*n+x1],c2=g[y1*n+x0],d=g[y1*n+x1],top=a+(b-a)*sx;o[y*S+x]=top+((c2+(d-c2)*sx)-top)*sy}}return o}

 const im=x.createImageData(S,S),d=im.data;for(let i=0;i<L.length;i++){const v=L[i],c=v>0?P.lt:P.dk,j=i*4;d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=Math.min(150,Math.abs(v)*P.a*255)}

 P.f.forEach(([ck,al,n,l0,l1,w])=>{const c=P[ck];x.lineWidth=w*q;for(let i=0;i<n;i++){const px=r()*S,py=r()*S,an=r()*6.2832,ln=(l0+r()*(l1-l0))*q,bd=(r()-.5)*ln*.7,ex=Math.cos(an)*ln,ey=Math.sin(an)*ln,cx=ex/2-Math.sin(an)*bd,cy=ey/2+Math.cos(an)*bd;x.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${al*(.5+r()*.5)})`;for(let ox=-1;ox<2;ox++)for(let oy=-1;oy<2;oy++){const sx=px+ox*S,sy=py+oy*S;if(sx<-ln||sx>S+ln||sy<-ln||sy>S+ln)continue;x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(sx+cx,sy+cy,sx+ex,sy+ey);x.stroke()}}});
 cv.toBlob(bl=>bl&&document.documentElement.style.setProperty('--tx-'+k,`url(${URL.createObjectURL(bl)})`))}
(()=>{const ks=Object.keys(TEX);let i=0;const nx=()=>{if(i<ks.length){genTex(ks[i++]);setTimeout(nx,30)}};genTex('plain');ks.splice(ks.indexOf('plain'),1);setTimeout(nx,30)})();

function applyLight(){const r=document.documentElement.style;r.setProperty('--li',FX.light?1:0);r.setProperty('--lx',LT.x.toFixed(1)+'%');r.setProperty('--ly',LT.y.toFixed(1)+'%');r.setProperty('--gp',(10+LT.x*.8).toFixed(1)+'%');r.setProperty('--ga',(105+(LT.y-50)*.25).toFixed(1)+'deg');r.setProperty('--tx',FX.tilt&&!RM.matches?((50-LT.y)*.08).toFixed(2):0);r.setProperty('--ty',FX.tilt&&!RM.matches?((LT.x-50)*.12).toFixed(2):0);r.setProperty('--sx',FX.light?((50-LT.x)*.22).toFixed(1):0)}
let _lt=0;function tickLight(n){const dt=Math.min(.033,Math.max(.001,((n||performance.now())-(_lt||n||performance.now()))/1000));_lt=n||performance.now();LT.vx=(LT.vx||0)+(90*(LT.tx-LT.x)-14*(LT.vx||0))*dt;LT.vy=(LT.vy||0)+(90*(LT.ty-LT.y)-14*(LT.vy||0))*dt;LT.x+=LT.vx*dt;LT.y+=LT.vy*dt;applyLight();if(Math.abs(LT.tx-LT.x)+Math.abs(LT.ty-LT.y)>.03||Math.abs(LT.vx)+Math.abs(LT.vy)>.08)LT.raf=requestAnimationFrame(tickLight);else{LT.raf=0;_lt=0}}

let PV=null;
const pvSig=b=>{const k=[b.pages.map((p,i)=>p.id||p.name||i).join(','),(covPage(b)||{}).id||'',b.cs,b.bc,b.mat,b.paper,b.rb,b.rc,b.bm,b.coverColor,b.env,b.radius,b.shadow,b.shape,b.ci,b.title].join('|');let h=2166136261;for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+':'+b.pages.length};
async function pvAnalyze(b,n,onp){const cv=document.createElement('canvas');cv.width=40;cv.height=56;const x=cv.getContext('2d',{willReadFrequently:true}),out=[];
 for(let i=0;i<n;i++){let sc=0;const p=b.pages[i];if(p&&p.img){try{const im=new Image();im.src=p.img;await im.decode();x.fillStyle='#fff';x.fillRect(0,0,40,56);x.drawImage(im,0,0,40,56);const d=x.getImageData(0,0,40,56).data;let ink=0,col=0;for(let j=0;j<d.length;j+=4){const mx=Math.max(d[j],d[j+1],d[j+2]),mn=Math.min(d[j],d[j+1],d[j+2]);if(mx<225)ink++;if(mx-mn>40)col++}const t=d.length/4;sc=Math.min(1,ink/t/.35)*.7+Math.min(1,col/t/.25)*.3}catch(e){}}
  out.push(sc);onp&&onp((i+1)/n);await new Promise(r=>setTimeout(r,16))}return out}
function pvPick(b,sc,N){const hi=Math.min(N-1,8);if(b.rb=='on'&&b.bm>0&&b.bm<=hi)return b.bm;let best=1,bs=-9;for(let s=1;s<=hi;s++){const L=2*s-3,R=2*s-2,a=L>=0&&L<b.pages.length?sc[L]||0:null,c=R>=0&&R<b.pages.length?sc[R]||0:null;if(a==null&&c==null)continue;const v=a!=null&&c!=null?(a+c)/2+.15*Math.min(a,c):(a??c)*.6;const t=v-.02*s;if(t>bs){bs=t;best=s}}return best}
function pvTimeline(T){const fl=clamp(.7+.12*(T-1),.8,1.5),cl=clamp(.8+.08*T,.9,1.5),k=[[0,0],[.45,0],[1.4,1],[1.55,1]];let t=1.55;if(T>1){t+=fl;k.push([t,T])}t+=.9;k.push([t,T>1?T:1]);t+=cl;k.push([t,0]);t+=.25;k.push([t,0]);

async function openPreview(b){if(PV||!b)return;

 document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('on'));
 const st=m.querySelector('.pvs'),ld=m.querySelector('.pvl'),pr=m.querySelector('.pr'),sm=m.querySelector('.pvc small'),re=m.querySelector('[data-p=re]'),pc=typeof ctl!='undefined'&&ctl?ctl:null;if(pc)pc.off=true;
 const api=mountBook(st,b,{noSingle:true,hf:.74,zoom:1.35});let alive=true,raf=0,busy=false;

 async function run(force){if(busy)return;busy=true;stop();api.setPos(0);
